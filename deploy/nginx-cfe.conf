# /etc/nginx/sites-available/cfe   (cambia server_name y la ruta de root)
server {
    listen 80;
    server_name _;

    root /home/TU_USUARIO/cfe/dist;
    index index.html;

    client_max_body_size 500m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker nunca debe quedar en caché, o las actualizaciones no llegan
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # generación de PDF
    }

    location /reports/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
